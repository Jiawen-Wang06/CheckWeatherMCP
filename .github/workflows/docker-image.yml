# Builds the MCP DayPlanner Docker image and publishes it to GitHub Container Registry (ghcr.io),
# where Azure Web App pulls it from. Optionally redeploys the Azure Web App after each push to master.
#
#   push to master   -> run tests, build, push  ghcr.io/<owner>/<repo>:latest and :sha-<commit>, deploy (if configured)
#   push a v* tag    -> run tests, build, push  ghcr.io/<owner>/<repo>:<version>
#   pull request     -> run tests and build only (nothing is pushed)
#
# Optional auto-deploy: add the repository variable AZURE_WEBAPP_NAME and the secret
# AZURE_WEBAPP_PUBLISH_PROFILE (see the deployment steps). Without them, the deploy job is skipped.

name: Build and publish Docker image

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      # No API keys needed: the unit tests mock the weather API and never call OpenAI.
      - run: python -m pytest -q

  build:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }} # lowercased automatically
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # Azure App Service Linux plans run amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure Web App
    needs: build
    # Only for pushes to master, and only once the Azure settings are added to the repository
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Image for this commit
        # Deploy the exact commit's image (sha tag), not "latest", so each deployment is traceable
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Deploy
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE }}
